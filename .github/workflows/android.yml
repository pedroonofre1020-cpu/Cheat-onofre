name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o Cheat_Onofre_projeto.zip -d projeto
          find projeto -maxdepth 4 -type f | head -100

      - name: Compilar APK
        run: |
          cd projeto
          find . -name gradlew -type f
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Arquivo gradlew não encontrado na raiz do projeto."
            exit 1
          fi
