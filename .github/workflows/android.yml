name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o Cheat_Onofre_projeto.zip -d projeto
          find projeto -name settings.gradle -o -name settings.gradle.kts
          find projeto -name gradlew

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd projeto/Cheat_Onofre
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cheat-Onofre-APK
          path: projeto/Cheat_Onofre/app/build/outputs/apk/debug/*.apk
